name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: pip install -e ".[dev]"

      - name: Lint e formatacao (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Testes
        run: pytest -v

      - name: Treino completo
        run: python -m falhas.treinar --sem-graficos --relatorio relatorio-ci

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem (treina o modelo)
        run: docker build -t previsao-falhas .
