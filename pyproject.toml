[project]
name = "previsao-falhas"
version = "1.0.0"
description = "Previsao de falhas em maquinas industriais com scikit-learn (dataset AI4I 2020) e API Flask"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "matplotlib>=3.9,<4",
    "joblib>=1.4",
    "flask>=3.1,<4",
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8"]
notebook = ["jupyter>=1.1", "nbclient>=0.10", "nbformat>=5.10", "ipykernel>=6.29"]
server = ["gunicorn>=23,<24"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["falhas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
